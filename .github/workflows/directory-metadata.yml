name: Update directory metadata

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smithery:
    name: Update Smithery listing copy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update and verify metadata without republishing the server
        env:
          SMITHERY_API_KEY: ${{ secrets.SMITHERY_API_KEY }}
        run: node scripts/update-smithery-listing.mjs
